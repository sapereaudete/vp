name: Versandpreise Aktualisieren

on:
  schedule:
    # Startet einmal pro Woche: Jeden Sonntag um 23:00 Uhr UTC
    - cron: '0 23 * * 0'
  workflow_dispatch:     # Aktiviert den "Run workflow"-Button zum manuellen Testen

permissions:
  contents: write       # Zwingend nötig, damit der Bot die preise.json überschreiben darf

jobs:
  update-process:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Projektabhängigkeiten installieren
        run: npm install

      - name: Scraper-Skript ausführen
        run: node update-prices.js

      - name: Änderungen auf GitHub speichern
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add preise.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Preise automatisch aktualisiert" && git push)
