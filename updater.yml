name: Update Versandpreise

on:
  schedule:
    - cron: '0 0 * * 0' # Jeden Sonntag um Mitternacht
  push:
    branches:
      - main # Oder 'master' – je nachdem wie dein Haupt-Branch heißt
  workflow_dispatch: # Ermöglicht es dir, den Ablauf manuell in GitHub zu starten

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt der GitHub Action, die geänderte preise.json hochzuladen

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Preise abrufen und JSON generieren
        run: node update-prices.js

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add preise.json
          git diff-index --quiet HEAD || git commit -m "Automatische Aktualisierung der Versandpreise"
          git push
